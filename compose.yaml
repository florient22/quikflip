# TrueNAS SCALE: Apps > Discover Apps > Custom App (Install via YAML).
# Before installing: change the dataset path (twice) and paste your token from `claude setup-token`.
services:
  quikflip:
    image: localhost/quikflip:0.3.1
    pull_policy: never          # the image is loaded onto the NAS by hand; see README.md
    container_name: quikflip
    restart: unless-stopped
    user: "568:568"
    ports:
      - "8080:8080"
    environment:
      QUIKFLIP_TIMEZONE: Europe/Brussels
    volumes:
      - /mnt/tank/apps/quikflip:/data   # replace "tank" with your pool; the dataset must be owned by user 568 (apps)

  # Makes puzzles ahead of time (Claude for Rarefind and Atlas Hunt, Deezer for Snippet) and judges contested answers; checks every hour.
  quikflip-generator:
    image: localhost/quikflip:0.3.1
    pull_policy: never
    container_name: quikflip-generator
    restart: unless-stopped
    user: "568:568"
    command: ["generate", "--loop"]
    environment:
      QUIKFLIP_TIMEZONE: Europe/Brussels
      QUIKFLIP_LANGUAGES: en,fr,nl      # drop languages you never play to use less of your subscription
      CLAUDE_CODE_OAUTH_TOKEN: paste-the-token-from-claude-setup-token-here
    volumes:
      - /mnt/tank/apps/quikflip:/data   # the same dataset as above
