# TrueNAS SCALE: Apps > Discover Apps > Custom App (Install via YAML).
# Before installing: sign the NAS in to ghcr.io (see README.md) and paste your token from `claude setup-token`.
# To update, change the version in both image lines. The database lives in the quikflip-data volume, which Docker
# creates on first start and keeps across updates.
services:
  quikflip:
    image: ghcr.io/florient22/quikflip:0.3.4
    container_name: quikflip
    restart: unless-stopped
    user: "568:568"
    ports:
      - "8090:8080"   # NAS port:container port; change only the first number if 8090 is taken, and the port under x-portals too
    environment:
      QUIKFLIP_TIMEZONE: Europe/Brussels
    volumes:
      - quikflip-data:/data

  # Makes puzzles ahead of time (Claude for Rarefind and Atlas Hunt, Deezer for Snippet) and judges contested answers; checks every hour.
  quikflip-generator:
    image: ghcr.io/florient22/quikflip:0.3.4
    container_name: quikflip-generator
    restart: unless-stopped
    user: "568:568"
    command: ["generate", "--loop"]
    environment:
      QUIKFLIP_TIMEZONE: Europe/Brussels
      QUIKFLIP_LANGUAGES: en,fr,nl      # drop languages you never play to use less of your subscription
      CLAUDE_CODE_OAUTH_TOKEN: paste-the-token-from-claude-setup-token-here
    volumes:
      - quikflip-data:/data   # the same volume as above

volumes:
  quikflip-data:

# The "Web UI" button on the app's page in TrueNAS. TrueNAS only reads this when the app is first installed,
# not when the YAML is edited later. 0.0.0.0 stands for the NAS's own address.
x-portals:
  - name: Web UI
    scheme: http
    host: 0.0.0.0
    port: 8090
    path: /
