<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atlas Hunt</title>
  <link rel="icon" href="../../icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../fonts/fonts.css">
  <link rel="stylesheet" href="../../css/dialog.css">
  <link rel="stylesheet" href="atlas.css">
  <script type="importmap">
    { "imports": { "three": "../../vendor/three/three.module.js", "three/addons/": "../../vendor/three/addons/" } }
  </script>
  <script src="../../vendor/d3/d3.min.js"></script>
  <script src="../../vendor/topojson/topojson-client.min.js"></script>
  <script type="module" src="atlas.js"></script>
</head>
<body>
  <div class="stage" id="stage"></div>
  <div class="labels" id="labels" aria-hidden="true"></div>

  <div class="zoom-controls" id="zoom" role="group">
    <button type="button" class="glass" data-zoom="in">+</button>
    <button type="button" class="glass" data-zoom="out">&minus;</button>
    <button type="button" class="glass" data-zoom="reset"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.5 2.2 2.5 13.8 0 16M12 4c-2.5 2.2-2.5 13.8 0 16"/></svg></button>
  </div>

  <header class="hud-top">
    <a class="round-btn glass" id="back" href="../../"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <section class="clue glass">
      <div class="clue-meta"><span class="wordmark">ATLAS HUNT</span><span id="meta"></span></div>
      <h1 id="clue"></h1>
      <p class="clue-hint" id="hint"></p>
    </section>
    <div class="top-right">
      <div class="score glass" id="score-card"><small id="score-label"></small><strong id="score">0</strong></div>
      <div class="round-buttons">
        <button type="button" class="round-btn glass" id="help"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.8M12 17.3v.2"/></svg></button>
        <button type="button" class="round-btn glass" id="open-settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.2 6.2l2.1 2.1M17.7 15.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 17.8l2.1-2.1M17.7 8.3l2.1-2.1"/></svg></button>
        <button type="button" class="round-btn glass" id="mute" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="sound-waves" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
      </div>
    </div>
  </header>

  <div class="banner" id="banner" aria-hidden="true"><strong id="banner-title"></strong><span class="glass" id="banner-sub"></span></div>

  <section class="fact glass" id="fact" aria-live="polite" hidden>
    <small id="fact-label"></small>
    <h2 id="fact-country"></h2>
    <p id="fact-text"></p>
    <button type="button" class="pill-btn" id="fact-next"></button>
  </section>

  <div class="hud-bottom">
    <p class="speech glass" id="speech" aria-live="polite"></p>
    <form class="launch-bar glass" id="launch-form" hidden>
      <label class="sr-only" for="country-input" id="input-label"></label>
      <input id="country-input" list="country-list" autocomplete="off" spellcheck="false" enterkeyhint="go">
      <button type="submit" id="raise"></button>
      <datalist id="country-list"></datalist>
    </form>
    <ol class="finds" id="finds"></ol>
    <p class="hint" id="controls-hint"></p>
  </div>

  <section class="summary" id="summary" hidden></section>
</body>
</html>
